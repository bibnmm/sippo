<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Model S</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 342 35" xmlns="http://www.w3.org/2000/svg" width="120">
                <path fill="#E82127" d="M0 .1a9.7 9.7 0 0 0 7 7h11v27.8h9.3V7.1h11a9.7 9.7 0 0 0 7-7H0zm117 0H82.4a9.7 9.7 0 0 0-7 7v20.8a9.7 9.7 0 0 0 7 7h34.6a9.7 9.7 0 0 0 7-7V.1zm-9.3 20.8h-16V7.1h16v13.8zM235 .1h-34.6a9.7 9.7 0 0 0-7 7v20.8a9.7 9.7 0 0 0 7 7H235a9.7 9.7 0 0 0 7-7V7.1a9.7 9.7 0 0 0-7-7zm-9.3 20.8h-16V7.1h16v13.8zM176 .1h-34.6a9.7 9.7 0 0 0-7 7v27.8h9.3V20.9h25.3v14h9.3V7.1a9.7 9.7 0 0 0-7-7zm-9.3 13.8h-16V7.1h16v6.8zM342 .1h-34.6a9.7 9.7 0 0 0-7 7v27.8h9.3V20.9h25.3v14h9.3V7.1a9.7 9.7 0 0 0-7-7zm-9.3 13.8h-16V7.1h16v6.8z"/>
            </svg>
        </div>

        <nav class="nav">
            <a href="#" class="nav-link active">Model S</a>
            <a href="#" class="nav-link">Model X</a>
            <a href="#" class="nav-link">Model 3</a>
            <a href="#" class="nav-link">Roadster</a>
            <a href="#" class="nav-link">Energy</a>
        </nav>

        <div class="right-menu">
            <a href="#" class="menu-link">Магазин</a>
            <a href="#" class="menu-link">Войти</a>
            <button class="burger-menu">&#9776;</button>
        </div>
    </header>

    <main class="hero">
        <div class="watermark">TESLA</div>

        <div class="hero-content">
            <h1 class="model-title">Model S</h1>
            <p class="subtitle">Добро пожаловать в будущее!</p>

            <div class="car-container">
                <img src="https://pngimg.com/uploads/tesla_car/tesla_car_PNG27.png" alt="Tesla Model S" class="car-img">
            </div>

            <div class="specs">
                <div class="spec-item">
                    <div class="spec-value">
                        <span class="speed-icon">&#9201;</span>
                        <span class="num">2,7</span> <span class="unit">сек</span>
                    </div>
                    <div class="spec-label">0-100 км/час</div>
                </div>

                <div class="spec-item">
                    <div class="spec-value">
                        <span class="tesla-badge">S</span>
                        <span class="num">632</span> <span class="unit">км</span>
                    </div>
                    <div class="spec-label">запас хода</div>
                </div>

                <div class="spec-actions">
                    <button class="btn btn-outline">&#9881; ТЕСТ ДРАЙВ</button>
                    <button class="btn btn-primary">ЗАКАЗАТЬ</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
